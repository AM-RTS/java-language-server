name: TermuIDE regressions
on:
  push:
    branches: [codex/termuide-fixes]
permissions:
  contents: read
jobs:
  java:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Cross-file regressions
        run: mvn -B -Dtest=CrossFileCompletionTest test
      - name: Java suite
        if: always()
        run: mvn -B test
      - name: Existing parser and pruner benchmarks
        if: always()
        run: bash scripts/benchmark.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surefire-reports
          path: target/surefire-reports/
