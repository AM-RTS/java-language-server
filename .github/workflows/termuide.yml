name: TermuIDE regressions
on:
  push:
    branches: [codex/termuide-fixes]
    paths: ['src/**', 'pom.xml', '.github/workflows/termuide.yml', 'scripts/benchmark.sh']
permissions:
  contents: read
jobs:
  java:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        check: [regressions, suite, benchmarks, baseline-benchmarks]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          ref: ${{ matrix.check == 'baseline-benchmarks' && '58daaa29a0e2fe22764283607da6801cf8b493b9' || github.sha }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Cross-file regressions
        if: matrix.check == 'regressions'
        run: mvn -B -Dtest=CrossFileCompletionTest,PlainCompletionTest test
      - name: Java suite
        if: matrix.check == 'suite'
        run: mvn -B test
      - name: Existing parser and pruner benchmarks
        if: matrix.check == 'benchmarks' || matrix.check == 'baseline-benchmarks'
        run: bash scripts/benchmark.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surefire-reports-${{ matrix.check }}
          path: target/surefire-reports/
